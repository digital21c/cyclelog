<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>CycleLog</title>
  <!-- Full-bleed background (sky-700) so maskable icons need no padding. -->
  <rect width="512" height="512" fill="#0369a1"/>
  <!-- Bicycle, kept within the central 60% "safe zone" that icon masks never crop. -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="170" cy="300" r="58" stroke-width="22"/>
    <circle cx="342" cy="300" r="58" stroke-width="22"/>
    <path d="M170 300 L250 300 L225 205 Z M225 205 L318 205 L250 300 M318 205 L342 300"
          stroke-width="20"/>
    <path d="M205 192 H246 M303 182 L318 205 M296 180 H330" stroke-width="18"/>
  </g>
</svg>
